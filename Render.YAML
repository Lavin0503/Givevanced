services:
  - type: web
    name: givevanced
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
